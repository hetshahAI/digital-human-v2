<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALICIA — AI Executive Receptionist | Dubai Corporate Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #070d18;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #error-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(7, 13, 24, 0.92);
        color: #f8fafc;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
        backdrop-filter: blur(20px);
        z-index: 999999;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="error-overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
